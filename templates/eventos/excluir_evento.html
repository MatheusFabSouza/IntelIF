<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Excluir evento</title>
</head>

<body>

    <h1>Excluir evento</h1>

    <p>
        Tem certeza que deseja excluir o evento
        <strong>{{ evento.titulo }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>
    </form>

    <a href="{% url 'eventos:listar_eventos' %}">
        Cancelar
    </a>

</body>
</html>
